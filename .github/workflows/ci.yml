name: CSWBench checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q aggregation evaluation generation scripts
      - name: Prompt integrity
        run: python scripts/recompute_prompt_stats.py --check
      - name: Offline protocol tests
        run: python -m unittest discover -s tests -v
